<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order food</title>
</head>
<body>
    <header>
        <h1>Krishna Beach Resort</h1>
    </header>
    <section>
        <div class="fooditem">
            <p>Chicken dum biryani             <button>-  1  +</button></p>
            <p>Chicken Lolipop 4 piece         <button>-  1  +</button></p>
            <p>Special chocolate ice cream     <button>-  1  +</button></p>
        </div>
        <div class="offer">
            <p>Save Rs. 100 with coupons  <button>Apply</button>      </p>
            
        </div>
        <br>
        <div class="button">
            <button>Order</button>
        </div>
    </section>
</body>
</html>
