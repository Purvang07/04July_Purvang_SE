
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Featured Movies</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
        }

        .movie-caption {
            background-color: white;
            color: #222;
            text-align: center;
            padding: 15px;
        }

        .movie-caption h5 {
            margin-bottom: 5px;
            font-weight: bold;
        }

        .movie-caption p {
            margin-bottom: 0;
            color: #666;
        }

        .movie-poster {
            height: 350px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="container my-5">
        <h2 class="text-center mb-4">Featured Movies</h2>

        <div id="movieCarousel" class="carousel slide"
             data-bs-ride="carousel">

            <!-- Carousel Indicators -->
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#movieCarousel"
                        data-bs-slide-to="0" class="active"
                        aria-label="Movie 1"></button>

                <button type="button" data-bs-target="#movieCarousel"
                        data-bs-slide-to="1"
                        aria-label="Movie 2"></button>

                <button type="button" data-bs-target="#movieCarousel"
                        data-bs-slide-to="2"
                        aria-label="Movie 3"></button>
            </div>

            <!-- Carousel Slides -->
            <div class="carousel-inner rounded shadow">

                <!-- Movie 1 -->
                <div class="carousel-item active">
                    <img src="img1.avif"
                         class="d-block w-100 movie-poster"
                         alt="Action movie poster">

                    <div class="movie-caption">
                        <h5>Action Heroes</h5>
                        <p>Action | Adventure | Thriller</p>
                    </div>
                </div>

                <!-- Movie 2 -->
                <div class="carousel-item">
                    <img src="img2.jpg"
                         class="d-block w-100 movie-poster"
                         alt="Romantic movie poster">

                    <div class="movie-caption">
                        <h5>Love Forever</h5>
                        <p>Romance | Drama</p>
                    </div>
                </div>

                <!-- Movie 3 -->
                <div class="carousel-item">
                    <img src="img3.avif"
                         class="d-block w-100 movie-poster"
                         alt="Comedy movie poster">

                    <div class="movie-caption">
                        <h5>Comedy Nights</h5>
                        <p>Comedy | Family</p>
                    </div>
                </div>

            </div>

            <!-- Previous Button -->
            <button class="carousel-control-prev" type="button"
                    data-bs-target="#movieCarousel"
                    data-bs-slide="prev">
                <span class="carousel-control-prev-icon"
                      aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>

            <!-- Next Button -->
            <button class="carousel-control-next" type="button"
                    data-bs-target="#movieCarousel"
                    data-bs-slide="next">
                <span class="carousel-control-next-icon"
                      aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>

        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
