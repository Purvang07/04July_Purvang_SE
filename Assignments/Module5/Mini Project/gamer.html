
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Tag Profile</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            background: linear-gradient(135deg, #101020, #241044, #101020);
            color: white;
            font-family: Arial, sans-serif;
        }

        .gamer-card {
            width: 100%;
            max-width: 420px;
            padding: 35px 25px;
            text-align: center;
            background-color: #19192b;
            border: 1px solid #39345b;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.2);
        }

        .avatar {
            width: 125px;
            height: 125px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #a855f7;
            margin-bottom: 18px;
        }

        .gamer-name {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .gamer-bio {
            color: #c5c5d8;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .status {
            display: inline-block;
            background-color: #143d2a;
            color: #4ade80;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .social-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            text-decoration: none;
            transition: transform 0.2s, opacity 0.2s;
        }

        .social-btn:hover {
            transform: translateY(-3px);
            opacity: 0.9;
            color: white;
        }

        .twitch {
            background-color: #9146ff;
        }

        .discord {
            background-color: #5865f2;
        }

        .steam {
            background-color: #2a475e;
        }

        .footer-text {
            color: #8888a5;
            font-size: 12px;
            margin-top: 25px;
            margin-bottom: 0;
        }

        /* Desktop layout */
        @media (min-width: 768px) {
            .gamer-card {
                max-width: 460px;
                padding: 40px;
            }

            .avatar {
                width: 145px;
                height: 145px;
            }
        }

        /* Small mobile screens */
        @media (max-width: 360px) {
            body {
                padding: 12px;
            }

            .gamer-card {
                padding: 25px 18px;
            }

            .gamer-name {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <main class="gamer-card">

        <!-- Gamer Avatar -->
        <img
            src="https://placehold.co/300x300/241044/ffffff?text=GAMER"
            alt="Gamer avatar"
            class="avatar"
        >

        <!-- Gamer Information -->
        <div>
            <span class="status">
                <i class="bi bi-circle-fill"></i> Gaming Profile
            </span>

            <h1 class="gamer-name">ShadowX</h1>

            <p class="text-info mb-2">Pro Gamer | FPS Enthusiast</p>

            <p class="gamer-bio">
                🎮 Living for epic plays and legendary wins.
                Join me for gaming streams, team matches,
                and unforgettable adventures!
            </p>
        </div>

        <!-- Social Profile Links -->
        <div class="social-links">

            <a href="https://www.twitch.tv/"
               target="_blank"
               rel="noopener noreferrer"
               class="social-btn twitch">
                <i class="bi bi-twitch"></i>
                Follow on Twitch
            </a>

            <a href="https://discord.com/"
               target="_blank"
               rel="noopener noreferrer"
               class="social-btn discord">
                <i class="bi bi-discord"></i>
                Join my Discord
            </a>

            <a href="https://store.steampowered.com/"
               target="_blank"
               rel="noopener noreferrer"
               class="social-btn steam">
                <i class="bi bi-steam"></i>
                View my Steam
            </a>

        </div>

        <p class="footer-text">
            GG! Thanks for visiting my profile.
        </p>

    </main>

</body>
</html>
