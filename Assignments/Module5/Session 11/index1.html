
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Review Card</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">

        <div class="card shadow-sm p-4 mx-auto" style="max-width: 600px;">

            <!-- Movie Title -->
            <h2 class="h3 fw-bold text-dark mb-3">
                The Adventure Begins
            </h2>

            <!-- Movie Rating -->
            <p class="fs-5 fw-semibold text-danger mb-3">
                ⭐ 8.5/10
                <span class="fs-6 fw-normal text-secondary">
                    (Audience Rating)
                </span>
            </p>

            <!-- Review Heading -->
            <h5 class="fw-bold">Movie Review</h5>

            <!-- Review Text -->
            <p class="fs-6 fw-normal text-secondary lh-base">
                This movie delivers an exciting story with impressive
                action scenes, excellent performances, and beautiful
                visuals. It is entertaining and worth watching with friends
                and family.
            </p>

            <!-- Reviewer Name -->
            <p class="small fw-medium text-dark mb-0">
                Reviewed by: Rahul Sharma
            </p>

        </div>

    </div>

</body>
</html>
