
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Product Showcase</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f1f3f6;
            font-family: Arial, sans-serif;
        }

        .product-card {
            height: 100%;
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .product-card img {
            height: 180px;
            object-fit: contain;
            padding: 15px;
        }

        .price {
            color: #198754;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <h2 class="mb-4">Featured Products</h2>

        <div class="row g-3">

            <!-- Product 1 -->
            <div class="col-6 col-md-3">
                <div class="card product-card">
                    <img src="https://placehold.co/300x200?text=Laptop"
                         class="card-img-top" alt="Laptop">

                    <div class="card-body">
                        <h5 class="card-title">Laptop</h5>
                        <p class="card-text">Powerful laptop for work and study.</p>
                        <p class="price">₹45,999</p>
                        <a href="#" class="btn btn-primary w-100">Buy Now</a>
                    </div>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="col-6 col-md-3">
                <div class="card product-card">
                    <img src="https://placehold.co/300x200?text=Smartphone"
                         class="card-img-top" alt="Smartphone">

                    <div class="card-body">
                        <h5 class="card-title">Smartphone</h5>
                        <p class="card-text">Smartphone with a stunning display.</p>
                        <p class="price">₹18,999</p>
                        <a href="#" class="btn btn-primary w-100">Buy Now</a>
                    </div>
                </div>
            </div>

            <!-- Product 3 -->
            <div class="col-6 col-md-3">
                <div class="card product-card">
                    <img src="https://placehold.co/300x200?text=Headphones"
                         class="card-img-top" alt="Headphones">

                    <div class="card-body">
                        <h5 class="card-title">Headphones</h5>
                        <p class="card-text">Enjoy clear sound and deep bass.</p>
                        <p class="price">₹1,999</p>
                        <a href="#" class="btn btn-primary w-100">Buy Now</a>
                    </div>
                </div>
            </div>

            <!-- Product 4 -->
            <div class="col-6 col-md-3">
                <div class="card product-card">
                    <img src="https://placehold.co/300x200?text=Smartwatch"
                         class="card-img-top" alt="Smartwatch">

                    <div class="card-body">
                        <h5 class="card-title">Smartwatch</h5>
                        <p class="card-text">Track your daily activity and fitness.</p>
                        <p class="price">₹2,499</p>
                        <a href="#" class="btn btn-primary w-100">Buy Now</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
