
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Product Cards</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <h2 class="text-center mb-4">Featured Products</h2>
        <div class="row g-4">
            <!-- Product 1 -->
            <div class="col-md-4">
                <div class="card h-100 shadow-sm">
                    <img src="hp.jpg"
                         class="card-img-top" alt="Laptop">

                    <div class="card-body">
                        <h5 class="card-title">Laptop</h5>
                        <p class="card-text">
                            Powerful laptop for coding and daily work.
                        </p>
                        <h5 class="text-success">₹45,999</h5>
                        <button class="btn btn-primary w-100">
                            Add to Cart
                        </button>
                    </div>
                </div>
            </div>
            <!-- Product 2 -->
            <div class="col-md-4">
                <div class="card h-100 shadow-sm">
                    <img src="iphone18.webp"
                         class="card-img-top" alt="Smartphone">

                    <div class="card-body">
                        <h5 class="card-title">Smartphone</h5>
                        <p class="card-text">
                            Stylish smartphone with a great display.
                        </p>
                        <h5 class="text-success">₹18,999</h5>
                        <button class="btn btn-primary w-100">
                            Add to Cart
                        </button>
                    </div>
                </div>
            </div>
            <!-- Product 3 -->
            <div class="col-md-4">
                <div class="card h-100 shadow-sm">
                    <img src="headphone.jpg"
                         class="card-img-top" alt="Headphones">

                    <div class="card-body">
                        <h5 class="card-title">Headphones</h5>
                        <p class="card-text">
                            Enjoy clear sound and comfortable listening.
                        </p>
                        <h5 class="text-success">₹1,499</h5>
                        <button class="btn btn-primary w-100">
                            Add to Cart
                        </button>
                    </div>
                </div>
            </div>  
        </div>
    </div>

</body>
</html>
