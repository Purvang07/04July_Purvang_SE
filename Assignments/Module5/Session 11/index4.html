
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Switcher</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

    <div id="mainContainer"
         class="container bg-light text-dark p-5 mt-5 rounded">
        
        <h2>Welcome to BookMyShow</h2>
        <p>Explore movies and book your favourite tickets!</p>

        <button id="themeButton" class="btn btn-primary">
            Switch to Dark Mode
        </button>

    </div>

    <script>
        const container = document.getElementById("mainContainer");
        const button = document.getElementById("themeButton");

        button.addEventListener("click", function () {
            container.classList.toggle("bg-light");
            container.classList.toggle("bg-dark");

            container.classList.toggle("text-dark");
            container.classList.toggle("text-light");

            if (container.classList.contains("bg-dark")) {
                button.textContent = "Switch to Light Mode";
            } else {
                button.textContent = "Switch to Dark Mode";
            }
        });
    </script>

</body>
</html>
