<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f3f6;
            margin: 0;
            padding: 20px;
        }

        /* Default styles */
        .product-card {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 20px;
            max-width: 650px;
            margin: 30px auto;
            padding: 24px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            font-size: 18px;
            box-sizing: border-box;
        }

        .product-card img {
            width: 220px;
            height: 180px;
            object-fit: contain;
        }

        .product-details {
            flex: 1;
        }

        .product-name {
            font-size: 24px;
        }
        .product-price {
            color: #388e3c;
            font-size: 22px;
            font-weight: bold;
        }
        .buy-button {
            background-color: #2874f0;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        /* Breakpoint 1: 1200px and below */
        @media only screen and (max-width: 1200px) {
            .product-card {
                padding: 20px;
                font-size: 17px;
            }

            .product-name {
                font-size: 22px;
            }
        }
        /* Breakpoint 2: 900px and below */
        @media only screen and (max-width: 900px) {
            .product-card {
                padding: 16px;
                font-size: 16px;
                gap: 15px;
            }

            .product-name {
                font-size: 20px;
            }

            .product-price {
                font-size: 20px;
            }
        }
        /* Breakpoint 3: 600px and below */
        @media only screen and (max-width: 600px) {
            .product-card {
                flex-direction: column;
                text-align: center;
                padding: 12px;
                font-size: 15px;
            }

            .product-card img {
                width: 100%;
                max-width: 220px;
            }

            .product-name {
                font-size: 18px;
            }

            .product-price {
                font-size: 19px;
            }

            .product-details {
                width: 100%;
            }

            .buy-button {
                width: 100%;
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="product-card">
        <img
            src="https://placehold.co/220x180?text=Laptop"
            alt="HP Laptop">

        <div class="product-details">
            <h2 class="product-name">HP Laptop 15</h2>
            <p>Intel Core i5 | 8GB RAM | 512GB SSD</p>
            <p class="product-price">₹49,999</p>
            <button class="buy-button">Buy Now</button>
        </div>
    </div>

</body>
</html>
