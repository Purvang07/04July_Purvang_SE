<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Chat Badge</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            min-height: 1500px;
            margin: 0;
            padding: 20px;
        }

        .chat-badge {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #25D366;
            color: white;
            padding: 15px 20px;
            margin: 10px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>My Website</h1>
    <p>Scroll down the page to see that the WhatsApp badge stays in place.</p>

    <div class="chat-badge">
        💬 WhatsApp Chat (1)
    </div>

</body>
</html>
