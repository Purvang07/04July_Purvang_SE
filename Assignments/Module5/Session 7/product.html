
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Product Grid</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <header>
        <h1>Flipkart</h1>
        <input type="text" placeholder="Search for products">
    </header>

    <h2>Best Deals on Products</h2>

    <section class="product-grid">

        <div class="product-card">
            <img src="https://m.media-amazon.com/images/I/510uTHyDqGL.jpg" alt="Laptop">
            <h3>Laptop</h3>
            <p>Starting from ₹35,000</p>
        </div>

        <div class="product-card">
            <img src="https://images.samsung.com/is/image/samsung/p6pim/in/s2602/gallery/in-galaxy-s26-s942-sm-s942bzvqins-thumb-550883873" alt="Mobile">
            <h3>Smartphone</h3>
            <p>Starting from ₹12,000</p>
        </div>

        <div class="product-card">
            <img src="https://www.headphonezone.in/cdn/shop/files/Headphone-Zone-HBD-630-hostpot-mobile-01.jpg?v=1763712130&width=1500" alt="Headphones">
            <h3>Headphones</h3>
            <p>Starting from ₹999</p>
        </div>

        <div class="product-card">
            <img src="https://rukminim2.flixcart.com/image/480/640/xif0q/shopsy-smartwatch/a/s/z/1-44-android-ios-android-smart-watch-men-4g-network-bt-call-gps-original-imagvy24dhbhe8zx.jpeg?q=90" alt="Watch">
            <h3>Smart Watch</h3>
            <p>Starting from ₹1,499</p>
        </div>

        <div class="product-card">
            <img src="https://m.media-amazon.com/images/I/61dIvwH7x7L._AC_UY1000_.jpg" alt="Shoes">
            <h3>Sports Shoes</h3>
            <p>Starting from ₹1,299</p>
        </div>

        <div class="product-card">
            <img src="https://www.ephotozine.com/articles/guide-to-buying-a-digital-camera-16734/images/highres-Panasonic-Lumix-FZ1000-Hands-On-14_1402407258.jpg" alt="Camera">
            <h3>Digital Camera</h3>
            <p>Starting from ₹15,000</p>
        </div>

    </section>

</body>
</html>
