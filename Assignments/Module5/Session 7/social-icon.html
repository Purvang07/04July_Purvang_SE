<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social App Icons</title>

    <style>
        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: #f2f2f2;
        }

        .container img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <h2>My Favorite Apps</h2>

    <div class="container">
        <img src="https://cdn.simpleicons.org/instagram/E4405F"
             alt="Instagram">

        <img src="https://cdn.simpleicons.org/whatsapp/25D366"
             alt="WhatsApp">

        <img src="https://cdn.simpleicons.org/zomato/CB202D"
             alt="Zomato">

        <img src="https://cdn.simpleicons.org/spotify/1DB954"
             alt="Spotify">
    </div>
</body>
</html>
