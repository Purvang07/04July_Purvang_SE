
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Links Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f4f4f8;
            font-family: Arial, sans-serif;
        }

        .form-container {
            max-width: 550px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            pointer-events: none;
        }

        .form-control {
            height: 50px;
            padding-left: 48px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: #e23744;
            box-shadow: 0 0 0 0.2rem rgba(226, 55, 68, 0.15);
        }

        .instagram { color: #d63384; }
        .linkedin { color: #0a66c2; }
        .youtube { color: #ff0000; }
        .github { color: #24292f; }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #e23744;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .submit-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="form-container">

            <h2 class="text-center mb-2">Add Social Links</h2>
            <p class="text-center text-secondary mb-4">
                Connect your social media profiles
            </p>

            <form id="socialLinksForm">

                <!-- Instagram Input -->
                <div class="mb-3">
                    <label for="instagram" class="form-label">Instagram</label>
                    <div class="input-wrapper">
                        <i class="bi bi-instagram input-icon instagram"
                           aria-hidden="true"></i>
                        <input type="url" id="instagram" class="form-control"
                               placeholder="https://instagram.com/username"
                               pattern="https?://(www\.)?instagram\.com/.*">
                    </div>
                </div>

                <!-- LinkedIn Input -->
                <div class="mb-3">
                    <label for="linkedin" class="form-label">LinkedIn</label>
                    <div class="input-wrapper">
                        <i class="bi bi-linkedin input-icon linkedin"
                           aria-hidden="true"></i>
                        <input type="url" id="linkedin" class="form-control"
                               placeholder="https://linkedin.com/in/username"
                               pattern="https?://(www\.)?linkedin\.com/.*">
                    </div>
                </div>

                <!-- YouTube Input -->
                <div class="mb-3">
                    <label for="youtube" class="form-label">YouTube</label>
                    <div class="input-wrapper">
                        <i class="bi bi-youtube input-icon youtube"
                           aria-hidden="true"></i>
                        <input type="url" id="youtube" class="form-control"
                               placeholder="https://youtube.com/@username"
                               pattern="https?://(www\.)?youtube\.com/.*">
                    </div>
                </div>

                <!-- GitHub Input -->
                <div class="mb-4">
                    <label for="github" class="form-label">GitHub</label>
                    <div class="input-wrapper">
                        <i class="bi bi-github input-icon github"
                           aria-hidden="true"></i>
                        <input type="url" id="github" class="form-control"
                               placeholder="https://github.com/username"
                               pattern="https?://(www\.)?github\.com/.*">
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    Save Social Links
                </button>

                <p id="message" class="text-center mt-3 mb-0"></p>

            </form>
        </div>
    </div>

    <script>
        document.getElementById("socialLinksForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                const message = document.getElementById("message");
                message.textContent = "Social links submitted successfully!";
                message.className = "text-center mt-3 mb-0 text-success";
            });
    </script>

</body>
</html>
