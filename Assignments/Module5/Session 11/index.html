
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Spacing Utilities</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <h2 class="text-center mb-4">Flipkart Product Cards</h2>

        <div class="row">

            <!-- Card 1: Small Spacing -->
            <div class="col-md-4">
                <div class="card m-1 p-1">
                    <img src="hp.jpg"
                         class="card-img-top" alt="Laptop">

                    <div class="card-body p-1">
                        <h5 class="card-title">HP Laptop</h5>
                        <p class="text-success mb-1">₹45,999</p>
                    </div>
                </div>
            </div>

            <!-- Card 2: Medium Spacing -->
            <div class="col-md-4">
                <div class="card m-2 p-2">
                    <img src="samsung.jpg"
                         class="card-img-top" alt="Smartphone">

                    <div class="card-body p-2">
                        <h5 class="card-title">Samsung Smartphone</h5>
                        <p class="text-success mb-2">₹18,999</p>
                    </div>
                </div>
            </div>

            <!-- Card 3: Large Spacing -->
            <div class="col-md-4">
                <div class="card m-3 p-3">
                    <img src="wireless.webp"
                         class="card-img-top" alt="Headphones">

                    <div class="card-body p-3">
                        <h5 class="card-title">Wireless Headphones</h5>
                        <p class="text-success mb-3">₹1,499</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
