<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Details</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row align-items-center">

            <!-- Movie Poster Column -->
            <div class="col-12 col-md-4 text-center mb-4 mb-md-0">
                <img src="https://placehold.co/300x400?text=Movie+Poster"
                     class="img-fluid rounded"
                     alt="Movie Poster">
            </div>

            <!-- Movie Details Column -->
            <div class="col-12 col-md-8">
                <h1 class="fw-bold">Avengers: Endgame</h1>

                <p><strong>Genre:</strong> Action, Adventure, Sci-Fi</p>

                <p><strong>Rating:</strong> ⭐ 8.4/10</p>

                <p>
                    The Avengers assemble for one final mission
                    to restore the universe and defeat Thanos.
                </p>

                <button class="btn btn-danger">
                    Book Now
                </button>
            </div>

        </div>
    </div>

</body>
</html>
