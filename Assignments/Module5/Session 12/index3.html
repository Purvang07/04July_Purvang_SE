
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Featured Playlists</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
        }

        .playlist-card {
            background-color: #242424;
            padding: 15px;
            border-radius: 12px;
            height: 100%;
            transition: 0.3s;
        }

        .playlist-card:hover {
            background-color: #333333;
        }

        .playlist-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
        }

        .playlist-card h5 {
            margin-top: 15px;
            font-weight: bold;
        }

        .listen-btn {
            background-color: #1db954;
            color: black;
            border: none;
            border-radius: 25px;
            padding: 9px 20px;
            font-weight: bold;
        }

        .listen-btn:hover {
            background-color: #1ed760;
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <h2 class="mb-4">Featured Playlists</h2>

        <div class="row g-4">

            <!-- Playlist 1 -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="playlist-card">
                    <img src="https://placehold.co/400x300/563d7c/ffffff?text=Chill+Vibes"
                         alt="Chill Vibes playlist cover">

                    <h5>Chill Vibes</h5>
                    <p class="text-secondary">Relax and enjoy peaceful music.</p>

                    <a href="https://open.spotify.com/"
                       target="_blank" rel="noopener noreferrer"
                       class="btn listen-btn">Listen Now</a>
                </div>
            </div>

            <!-- Playlist 2 -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="playlist-card">
                    <img src="https://placehold.co/400x300/9b2948/ffffff?text=Workout+Hits"
                         alt="Workout Hits playlist cover">

                    <h5>Workout Hits</h5>
                    <p class="text-secondary">Energetic tracks for your workout.</p>

                    <a href="https://open.spotify.com/"
                       target="_blank" rel="noopener noreferrer"
                       class="btn listen-btn">Listen Now</a>
                </div>
            </div>

            <!-- Playlist 3 -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="playlist-card">
                    <img src="https://placehold.co/400x300/236b62/ffffff?text=Top+Hits"
                         alt="Top Hits playlist cover">

                    <h5>Top Hits</h5>
                    <p class="text-secondary">Discover popular songs and artists.</p>

                    <a href="https://open.spotify.com/"
                       target="_blank" rel="noopener noreferrer"
                       class="btn listen-btn">Listen Now</a>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
