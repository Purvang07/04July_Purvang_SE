<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Card</title>

    <style>
        .restaurant-card {
            margin: 30px;
            padding: 20px;
            border: 2px solid #e23744;
            border-radius: 10px;
            width: 300px;
            font-family: Arial, sans-serif;
        }

        .restaurant-name {
            margin-bottom: 10px;
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }

        .cuisine {
            margin: 10px 0;
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }

        .rating {
            margin-top: 10px;
            padding: 10px;
            background-color: #e8f5e9;
            color: #1b5e20;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <article class="restaurant-card">

        <header class="restaurant-name">
            <h2>Spice Garden</h2>
        </header>

        <section class="cuisine">
            <p>Cuisine: North Indian, Punjabi</p>
        </section>

        <footer class="rating">
            Rating: 4.5 / 5 ⭐⭐⭐⭐
        </footer>

    </article>

</body>
</html>
