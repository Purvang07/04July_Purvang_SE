<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Ensures proper scaling on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flipkart Product Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f3f6;
            margin: 0;
            padding: 20px;
        }
        .product-card {
            width: 100%;
            max-width: 300px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            text-align: center;
        }
        .product-card img {
            width: 100%;
            max-width: 220px;
            height: 180px;
            object-fit: contain;
        }
        .product-name {
            font-size: 20px;
            margin: 15px 0 10px;
        }
        .product-price {
            color: #388e3c;
            font-size: 22px;
            font-weight: bold;
        }
        .buy-button {
            background-color: #2874f0;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        .buy-button:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>
    <div class="product-card">
        <img
            src="acer.jpg"
            alt="Laptop product">

        <h2 class="product-name">HP Laptop 15</h2>

        <p>Intel Core i5 | 8GB RAM | 512GB SSD</p>

        <p class="product-price">₹49,999</p>

        <button class="buy-button">Buy Now</button>
    </div>

</body>
</html>
