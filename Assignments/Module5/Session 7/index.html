
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Grid</title>
    <link rel="stylesheet" href="style4.css">
</head>
<body>

    <h2>Flipkart Products</h2>

    <section class="product-grid">

        <div class="product-card">
            <img src="https://placehold.co/200x150?text=Laptop" alt="Laptop">
            <h3>Laptop</h3>
            <p>₹35,000</p>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/200x150?text=Mobile" alt="Mobile">
            <h3>Smartphone</h3>
            <p>₹12,000</p>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/200x150?text=Headphones" alt="Headphones">
            <h3>Headphones</h3>
            <p>₹999</p>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/200x150?text=Watch" alt="Smart Watch">
            <h3>Smart Watch</h3>
            <p>₹1,499</p>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/200x150?text=Shoes" alt="Shoes">
            <h3>Sports Shoes</h3>
            <p>₹1,299</p>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/200x150?text=Camera" alt="Camera">
            <h3>Digital Camera</h3>
            <p>₹15,000</p>
        </div>

    </section>

</body>
</html>
